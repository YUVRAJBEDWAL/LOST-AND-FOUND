<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>User Login | Campus Lost & Found</title>
  <link rel="stylesheet" href="assets/css/style.css" />
  <style>
    .auth-wrapper {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: linear-gradient(120deg, rgba(47,111,237,0.12), rgba(48,195,158,0.12));
      padding: 2rem;
    }
    .auth-card {
      background: #fff;
      border-radius: 1.25rem;
      padding: 2.5rem;
      width: min(420px, 100%);
      box-shadow: var(--shadow);
    }
    .input-icon {
      display: flex;
      align-items: center;
      border: 1px solid var(--border);
      border-radius: 0.85rem;
      padding: 0.75rem;
      gap: 0.75rem;
      transition: border-color 0.2s ease, box-shadow 0.2s ease;
    }
    .input-icon:focus-within {
      border-color: var(--primary);
      box-shadow: 0 0 0 3px rgba(47, 111, 237, 0.15);
    }
    .input-icon span {
      font-size: 1.2rem;
      color: var(--primary);
      user-select: none;
    }
    .input-icon input {
      border: none;
      flex: 1;
      font-size: 1rem;
      background: transparent;
      outline: none;
    }
    .password-toggle {
      cursor: pointer;
      font-size: 1.1rem;
      color: var(--text-light);
      transition: color 0.2s ease;
      user-select: none;
    }
    .password-toggle:hover {
      color: var(--primary);
    }
    .alert-container {
      margin-bottom: 1rem;
      min-height: 40px;
    }
    .btn-loading {
      position: relative;
      color: transparent !important;
    }
    .btn-loading::after {
      content: "";
      position: absolute;
      width: 20px;
      height: 20px;
      top: 50%;
      left: 50%;
      margin-left: -10px;
      margin-top: -10px;
      border: 2px solid #ffffff;
      border-radius: 50%;
      border-top-color: transparent;
      animation: spinner 0.6s linear infinite;
    }
    @keyframes spinner {
      to { transform: rotate(360deg); }
    }
    .field-error {
      border-color: var(--danger) !important;
      box-shadow: 0 0 0 3px rgba(220, 38, 38, 0.15) !important;
    }
    .error-message {
      color: var(--danger);
      font-size: 0.875rem;
      margin-top: 0.25rem;
      display: none;
    }
    .error-message.show {
      display: block;
    }
  </style>
</head>
<body>
  <div class="auth-wrapper">
    <form class="auth-card" id="loginForm">
      <h1>Welcome Back</h1>
      <p style="color:var(--text-light); margin-bottom:2rem;">Log in to manage your reports.</p>
      
      <div class="alert-container" id="alertContainer"></div>
      
      <div class="field">
        <label for="email">Email</label>
        <div class="input-icon" id="emailField">
          <span>✉️</span>
          <input type="email" id="email" name="email" placeholder="you@campus.edu" required />
        </div>
        <div class="error-message" id="emailError">Please enter a valid email address</div>
      </div>
      
      <div class="field">
        <label for="password">Password</label>
        <div class="input-icon" id="passwordField">
          <span>🔒</span>
          <input type="password" id="password" name="password" placeholder="Enter your password" required />
          <span class="password-toggle" id="passwordToggle">👁️</span>
        </div>
        <div class="error-message" id="passwordError">Password is required</div>
      </div>
      
      <button type="submit" class="btn btn-primary" style="width:100%; margin-top:1.5rem;" id="loginBtn">Login</button>
      
      <p style="margin-top:1.5rem; text-align:center; color:var(--text-light);">
        New user? <a href="register.html" style="color:var(--primary); font-weight:600;">Create an account</a>
      </p>
    </form>
  </div>
  <script src="frontend/js/api.js"></script>
  <script src="frontend/js/auth.js"></script>
  <script>
    document.addEventListener('DOMContentLoaded', function() {
      const form = document.getElementById('loginForm');
      const emailInput = document.getElementById('email');
      const passwordInput = document.getElementById('password');
      const passwordToggle = document.getElementById('passwordToggle');
      const loginBtn = document.getElementById('loginBtn');
      const alertContainer = document.getElementById('alertContainer');
      const emailField = document.getElementById('emailField');
      const passwordField = document.getElementById('passwordField');
      const emailError = document.getElementById('emailError');
      const passwordError = document.getElementById('passwordError');
      
      // Password toggle functionality
      passwordToggle.addEventListener('click', function() {
        const type = passwordInput.type === 'password' ? 'text' : 'password';
        passwordInput.type = type;
        passwordToggle.textContent = type === 'password' ? '👁️' : '👁️‍🗨️';
      });
      
      // Email validation
      function validateEmail(email) {
        const emailRegex = /^[^\s@]+@[^\s@]+\.[^\s@]+$/;
        return emailRegex.test(email);
      }
      
      // Show alert message
      function showAlert(message, type) {
        alertContainer.innerHTML = `<div class="alert alert-${type}">${message}</div>`;
        setTimeout(() => {
          alertContainer.innerHTML = '';
        }, 5000);
      }
      
      // Clear field errors
      function clearFieldErrors() {
        emailField.classList.remove('field-error');
        passwordField.classList.remove('field-error');
        emailError.classList.remove('show');
        passwordError.classList.remove('show');
      }
      
      // Show field error
      function showFieldError(field, errorElement) {
        field.classList.add('field-error');
        errorElement.classList.add('show');
      }
      
      // Form submission
      form.addEventListener('submit', async function(e) {
        e.preventDefault();
        
        const email = emailInput.value.trim();
        const password = passwordInput.value;
        
        // Clear previous errors
        clearFieldErrors();
        
        // Validate form
        let isValid = true;
        
        if (!email) {
          showFieldError(emailField, emailError);
          emailError.textContent = 'Email is required';
          isValid = false;
        } else if (!validateEmail(email)) {
          showFieldError(emailField, emailError);
          emailError.textContent = 'Please enter a valid email address';
          isValid = false;
        }
        
        if (!password) {
          showFieldError(passwordField, passwordError);
          passwordError.textContent = 'Password is required';
          isValid = false;
        }
        
        if (!isValid) {
          return;
        }
        
        try {
          // Show loading state
          loginBtn.classList.add('btn-loading');
          loginBtn.disabled = true;
          
          // Call login API
          const response = await fetch('http://localhost:8080/api/auth/login', {
            method: 'POST',
            headers: {
              'Content-Type': 'application/json',
            },
            body: JSON.stringify({ email, password })
          });
          
          const data = await response.json();
          
          if (!response.ok) {
            throw new Error(data.message || 'Login failed. Please check your credentials.');
          }
          
          // Store JWT token and user data
          localStorage.setItem('jwtToken', data.token);
          localStorage.setItem('user', JSON.stringify({
            id: data.userId,
            email: data.email,
            name: data.name,
            role: data.role
          }));
          
          showAlert(`Welcome back, ${data.name}!`, 'success');
          
          // Redirect based on role
          setTimeout(() => {
            if (data.role === 'ADMIN') {
              window.location.href = 'admin/dashboard.html';
            } else {
              window.location.href = 'items.html';
            }
          }, 1500);
          
        } catch (error) {
          showAlert(error.message || 'Login failed. Please try again.', 'error');
        } finally {
          // Hide loading state
          loginBtn.classList.remove('btn-loading');
          loginBtn.disabled = false;
        }
      });
      
      // Clear errors on input
      emailInput.addEventListener('input', function() {
        if (emailField.classList.contains('field-error')) {
          emailField.classList.remove('field-error');
          emailError.classList.remove('show');
        }
      });
      
      passwordInput.addEventListener('input', function() {
        if (passwordField.classList.contains('field-error')) {
          passwordField.classList.remove('field-error');
          passwordError.classList.remove('show');
        }
      });
    });
  </script>
</body>
</html>
