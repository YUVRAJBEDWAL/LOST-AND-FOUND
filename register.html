<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Create Account | Campus Lost & Found</title>
  <link rel="stylesheet" href="assets/css/style.css" />
</head>
<body>
  <section class="hero" style="min-height:100vh; display:flex; align-items:center;">
    <div class="container" style="max-width:600px;">
      <div class="form-card">
        <h1>Create Your Account</h1>
        <p style="color:var(--text-light); margin-bottom:1.5rem;">Track your lost/found submissions in one place.</p>
        <form data-validate>
          <div class="field">
            <label for="name">Full Name</label>
            <input id="name" name="name" placeholder="John Doe" required />
          </div>
          <div class="field">
            <label for="registerEmail">Campus Email</label>
            <input type="email" id="registerEmail" name="email" placeholder="john@campus.edu" required />
          </div>
          <div class="field">
            <label for="phone">Phone (Optional)</label>
            <input type="tel" id="phone" name="phone" placeholder="+1234567890" />
          </div>
          <div class="field">
            <label for="password">Password</label>
            <input type="password" id="password" name="password" placeholder="Min 6 characters" required />
          </div>
          <div class="field">
            <label for="confirmPassword">Confirm Password</label>
            <input type="password" id="confirmPassword" placeholder="Re-enter password" required />
          </div>
          <button class="btn btn-primary" style="width:100%; margin-top:1rem;">Create Account</button>
          <p style="margin-top:1rem; text-align:center;">Already registered? <a href="login.html" style="color:var(--primary);">Login</a></p>
        </form>
      </div>
    </div>
  </section>
  <script src="assets/js/main.js"></script>
  <script src="assets/js/api.js"></script>
  <script>
    document.addEventListener('DOMContentLoaded', async function() {
      const form = document.querySelector('form[data-validate]');
      const registerBtn = form.querySelector('button[type="submit"]');
      
      form.addEventListener('submit', async (e) => {
        e.preventDefault();
        
        const name = form.querySelector('#name').value;
        const email = form.querySelector('#registerEmail').value;
        const phone = form.querySelector('#phone').value;
        const password = form.querySelector('#password').value;
        const confirmPassword = form.querySelector('#confirmPassword').value;
        
        // Validate passwords match
        if (password !== confirmPassword) {
          UI.showAlert('Passwords do not match', 'error');
          return;
        }
        
        if (password.length < 6) {
          UI.showAlert('Password must be at least 6 characters', 'error');
          return;
        }
        
        try {
          UI.showLoading(registerBtn);
          
          const response = await API.auth.register({
            name,
            email,
            phone,
            password
          });
          
          UI.showAlert(`Account created successfully! Welcome, ${response.name}!`, 'success');
          
          // Redirect to dashboard after successful registration
          setTimeout(() => {
            window.location.href = 'index.html';
          }, 1500);
          
        } catch (error) {
          UI.showAlert(error.message, 'error');
        } finally {
          UI.hideLoading(registerBtn);
        }
      });
    });
  </script>
</body>
</html>
