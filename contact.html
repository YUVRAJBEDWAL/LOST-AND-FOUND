<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Contact Us | Campus Lost & Found</title>
  <link rel="stylesheet" href="assets/css/style.css" />
</head>
<body>
  <header>
    <div class="navbar">
      <a class="logo" href="index.html"><strong>Campus Lost & Found</strong></a>
      <nav>
        <ul class="nav-links">
          <li><a href="items-list.html">Items</a></li>
          <li><a href="report-lost.html">Report Lost</a></li>
          <li><a href="report-found.html">Report Found</a></li>
          <li><a href="contact.html" class="btn btn-primary">Contact</a></li>
        </ul>
      </nav>
    </div>
  </header>

  <main class="container" style="margin-top:2rem;">
    <h1 class="section-title">Contact Campus Support</h1>
    <div class="contact-section">
      <form class="form-card" data-validate>
        <div class="form-row">
          <div class="field">
            <label for="contactName">Name</label>
            <input id="contactName" required />
          </div>
          <div class="field">
            <label for="contactEmail">Email</label>
            <input type="email" id="contactEmail" required />
          </div>
        </div>
        <div class="field">
          <label for="contactSubject">Subject</label>
          <input id="contactSubject" placeholder="Need assistance with..." required />
        </div>
        <div class="field">
          <label for="contactMessage">Message</label>
          <textarea id="contactMessage" required></textarea>
        </div>
        <button class="btn btn-primary">Send Message</button>
      </form>
      <div class="card">
        <h3>Visit Us</h3>
        <p>Student Services Center, 2nd Floor<br/>Mon - Fri, 9am - 6pm</p>
        <div class="map-placeholder" style="margin-top:1.5rem; padding:0;">
          <iframe
            title="Campus Google Map"
            width="100%"
            height="320"
            style="border:0; border-radius:1rem;"
            loading="lazy"
            allowfullscreen
            referrerpolicy="no-referrer-when-downgrade"
            src="https://www.google.com/maps/embed?pb=!1m18!1m12!1m3!1d3151.835434509566!2d144.9559233116199!3d-37.81720997965166!2m3!1f0!2f0!3f0!3m2!1i1024!2i768!4f13.1!3m3!1m2!1s0x0%3A0x0!2zMzfCsDQ5JzAyLjAiUyAxNDTCsDU3JzI4LjAiRQ!5e0!3m2!1sen!2sus!4v1700000000000">
          </iframe>
        </div>
      </div>
    </div>
  </main>

  <footer class="footer">
    <p>Emergency? Call Campus Security at (555) 111-2222</p>
  </footer>

  <script src="assets/js/main.js"></script>
</body>
</html>
