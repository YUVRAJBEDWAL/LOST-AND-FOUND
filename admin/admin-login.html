<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Admin Login | Campus Lost & Found</title>
  <link rel="stylesheet" href="../assets/css/admin.css" />
</head>
<body>
  <div class="login-card">
    <h1>Admin Access</h1>
    <p style="color:#94a3b8; margin-bottom:2rem;">Secure login for campus administrators.</p>
    <form data-validate>
      <div class="form-group">
        <label for="adminEmail">Email</label>
        <input type="email" id="adminEmail" placeholder="admin@campus.edu" required />
      </div>
      <div class="form-group">
        <label for="adminPassword">Password</label>
        <input type="password" id="adminPassword" placeholder="********" required />
      </div>
      <button class="btn btn-primary" style="width:100%; margin-top:0.5rem;">Login</button>
      <p style="margin-top:1.5rem; color:#94a3b8; text-align:center;">Forgot password? Contact IT security.</p>
    </form>
  </div>
  <script src="../assets/js/admin.js"></script>
</body>
</html>
