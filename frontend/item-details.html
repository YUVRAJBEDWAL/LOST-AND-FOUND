<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Item Details | Campus Lost & Found</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <!-- Navigation -->
    <nav class="navbar">
        <div class="container">
            <div class="navbar-content">
                <a href="index.html" class="logo">Campus Lost & Found</a>
                <ul class="nav-links">
                    <li><a href="index.html">Home</a></li>
                    <li><a href="items.html">Browse Items</a></li>
                    <li><a href="report-lost.html">Report Lost</a></li>
                    <li><a href="report-found.html">Report Found</a></li>
                    <li><a href="contact.html">Contact</a></li>
                    <!-- Auth links will be added dynamically -->
                </ul>
            </div>
        </div>
    </nav>

    <!-- Item Details Section -->
    <section class="section">
        <div class="container">
            <div class="max-w-6xl mx-auto">
                <!-- Breadcrumb -->
                <nav class="mb-6">
                    <ol class="flex text-sm text-secondary">
                        <li><a href="index.html" class="hover:text-primary">Home</a></li>
                        <li class="mx-2">/</li>
                        <li><a href="items.html" class="hover:text-primary">Items</a></li>
                        <li class="mx-2">/</li>
                        <li id="breadcrumbItem">Item Details</li>
                    </ol>
                </nav>

                <!-- Item Details Container -->
                <div id="itemDetailsContainer">
                    <div class="text-center py-12">
                        <div class="loading"></div>
                        <p class="text-secondary mt-4">Loading item details...</p>
                    </div>
                </div>

                <!-- Similar Items Section -->
                <section class="mt-12">
                    <h2 class="text-2xl font-bold mb-6">Similar Items</h2>
                    <div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6" id="similarItems">
                        <!-- Similar items will be loaded here -->
                    </div>
                </section>
            </div>
        </div>
    </section>

    <!-- Footer -->
    <footer class="footer">
        <div class="container">
            <p>&copy; <span id="year"></span> Campus Lost & Found | Built for connected campuses.</p>
        </div>
    </footer>

    <!-- Scripts -->
    <script src="js/api.js"></script>
    <script src="js/auth.js"></script>
    <script src="js/items.js"></script>
    <script>
        // Set current year and load item details
        document.addEventListener('DOMContentLoaded', () => {
            document.getElementById('year').textContent = new Date().getFullYear();
            loadItemDetails();
        });

        async function loadItemDetails() {
            const urlParams = new URLSearchParams(window.location.search);
            const itemId = urlParams.get('id');
            const itemType = urlParams.get('type') || 'lost';

            if (!itemId) {
                showError('No item ID provided');
                return;
            }

            try {
                const item = await api.get(`/items/${itemType}/${itemId}`);
                displayItemDetails(item, itemType);
                loadSimilarItems(item.category, itemType);
            } catch (error) {
                console.error('Error loading item details:', error);
                showError('Failed to load item details');
            }
        }

        function displayItemDetails(item, type) {
            const container = document.getElementById('itemDetailsContainer');
            const breadcrumbItem = document.getElementById('breadcrumbItem');
            
            // Update breadcrumb
            breadcrumbItem.textContent = item.name;
            
            const statusBadge = type === 'lost' ? 
                '<span class="badge badge-warning">Lost</span>' : 
                '<span class="badge badge-success">Found</span>';

            const statusIcon = type === 'lost' ? 
                '<svg class="w-6 h-6 text-warning" fill="currentColor" viewBox="0 0 20 20"><path d="M9 2a1 1 0 000 2h2a1 1 0 100-2H9z"/><path fill-rule="evenodd" d="M4 5a2 2 0 012-2 1 1 0 000 2H6a2 2 0 100 4h2a2 2 0 100-4h-.5a1 1 0 000-2H8a2 2 0 012-2h4a2 2 0 012 2v9a2 2 0 01-2 2H6a2 2 0 01-2-2V5z" clip-rule="evenodd"/></svg>' :
                '<svg class="w-6 h-6 text-success" fill="currentColor" viewBox="0 0 20 20"><path d="M9 2a1 1 0 000 2h2a1 1 0 100-2H9z"/><path fill-rule="evenodd" d="M4 5a2 2 0 012-2 1 1 0 000 2H6a2 2 0 100 4h2a2 2 0 100-4h-.5a1 1 0 000-2H8a2 2 0 012-2h4a2 2 0 012 2v9a2 2 0 01-2 2H6a2 2 0 01-2-2V5z" clip-rule="evenodd"/></svg>';

            container.innerHTML = `
                <div class="grid grid-cols-1 lg:grid-cols-3 gap-8">
                    <!-- Main Content -->
                    <div class="lg:col-span-2">
                        <div class="card">
                            <div class="card-body">
                                <!-- Header -->
                                <div class="flex items-start justify-between mb-6">
                                    <div class="flex items-center gap-3">
                                        ${statusIcon}
                                        <div>
                                            <h1 class="text-3xl font-bold mb-2">${escapeHtml(item.name)}</h1>
                                            <div class="flex items-center gap-2">
                                                ${statusBadge}
                                                <span class="text-secondary">${item.category}</span>
                                            </div>
                                        </div>
                                    </div>
                                </div>

                                <!-- Description -->
                                <div class="mb-6">
                                    <h3 class="text-lg font-semibold mb-3">Description</h3>
                                    <p class="text-secondary leading-relaxed">${escapeHtml(item.description || 'No description provided')}</p>
                                </div>

                                <!-- Details Grid -->
                                <div class="grid grid-cols-1 md:grid-cols-2 gap-6 mb-6">
                                    <div>
                                        <h3 class="text-lg font-semibold mb-3">Location Details</h3>
                                        <div class="space-y-2">
                                            <p class="text-secondary">
                                                <strong>Where:</strong> ${escapeHtml(item.location)}
                                            </p>
                                            <p class="text-secondary">
                                                <strong>When:</strong> ${formatDate(type === 'lost' ? item.dateLost : item.dateFound)}
                                            </p>
                                        </div>
                                    </div>
                                    <div>
                                        <h3 class="text-lg font-semibold mb-3">Contact Information</h3>
                                        <div class="space-y-2">
                                            <p class="text-secondary">
                                                <strong>Contact:</strong> ${escapeHtml(item.contactName || 'Anonymous')}
                                            </p>
                                            <p class="text-secondary">
                                                <strong>Email:</strong> ${escapeHtml(item.contactEmail)}
                                            </p>
                                            <p class="text-secondary">
                                                <strong>Phone:</strong> ${escapeHtml(item.contactPhone || 'Not provided')}
                                            </p>
                                        </div>
                                    </div>
                                </div>

                                <!-- Actions -->
                                <div class="flex gap-4">
                                    ${type === 'lost' ? 
                                        `<button onclick="claimItem('${item.id}')" class="btn btn-primary">
                                            <svg class="w-4 h-4 mr-2" fill="currentColor" viewBox="0 0 20 20">
                                                <path fill-rule="evenodd" d="M10 18a8 8 0 100-16 8 8 0 000 16zm3.707-9.293a1 1 0 00-1.414-1.414L9 10.586 7.707 9.293a1 1 0 00-1.414 1.414l2 2a1 1 0 001.414 0l4-4z" clip-rule="evenodd"/>
                                            </svg>
                                            Claim This Item
                                        </button>` : 
                                        `<button onclick="contactOwner('${item.id}')" class="btn btn-primary">
                                            <svg class="w-4 h-4 mr-2" fill="currentColor" viewBox="0 0 20 20">
                                                <path d="M2.003 5.884L10 9.882l7.997-3.998A2 2 0 0016 4H4a2 2 0 00-1.997 1.884z"/>
                                                <path d="M18 8.118l-8 4-8-4V14a2 2 0 002 2h12a2 2 0 002-2V8.118z"/>
                                            </svg>
                                            Contact Owner
                                        </button>`
                                    }
                                    <button onclick="shareItem('${item.id}', '${type}')" class="btn btn-outline">
                                        <svg class="w-4 h-4 mr-2" fill="currentColor" viewBox="0 0 20 20">
                                            <path d="M15 8a3 3 0 10-2.977-2.63l-4.94 2.47a3 3 0 100 4.319l4.94 2.47a3 3 0 10.895-1.789l-4.94-2.47a3.027 3.027 0 000-.74l4.94-2.47C13.456 7.68 14.19 8 15 8z"/>
                                        </svg>
                                        Share
                                    </button>
                                </div>
                            </div>
                        </div>
                    </div>

                    <!-- Sidebar -->
                    <div class="lg:col-span-1">
                        <!-- Status Card -->
                        <div class="card mb-6">
                            <div class="card-body">
                                <h3 class="text-lg font-semibold mb-4">Status Information</h3>
                                <div class="space-y-3">
                                    <div class="flex items-center justify-between">
                                        <span class="text-secondary">Status</span>
                                        ${statusBadge}
                                    </div>
                                    <div class="flex items-center justify-between">
                                        <span class="text-secondary">Reported</span>
                                        <span class="font-medium">${formatDate(item.createdAt)}</span>
                                    </div>
                                    <div class="flex items-center justify-between">
                                        <span class="text-secondary">Category</span>
                                        <span class="font-medium">${item.category}</span>
                                    </div>
                                    <div class="flex items-center justify-between">
                                        <span class="text-secondary">Priority</span>
                                        <span class="badge badge-info">Normal</span>
                                    </div>
                                </div>
                            </div>
                        </div>

                        <!-- Quick Actions -->
                        <div class="card">
                            <div class="card-body">
                                <h3 class="text-lg font-semibold mb-4">Quick Actions</h3>
                                <div class="space-y-2">
                                    <button onclick="reportSimilar()" class="btn btn-outline w-full">
                                        Report Similar Item
                                    </button>
                                    <button onclick="reportIssue()" class="btn btn-outline w-full">
                                        Report Issue
                                    </button>
                                    <button onclick="addToWatchlist()" class="btn btn-outline w-full">
                                        Add to Watchlist
                                    </button>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
            `;
        }

        async function claimItem(itemId) {
            if (!api.isLoggedIn()) {
                api.showAlert('Please login to claim this item', 'warning');
                return;
            }

            try {
                await api.post('/claims', { itemId, type: 'lost' });
                api.showAlert('Claim submitted successfully!', 'success');
            } catch (error) {
                api.showAlert('Failed to submit claim', 'error');
            }
        }

        function contactOwner(itemId) {
            if (!api.isLoggedIn()) {
                api.showAlert('Please login to contact the owner', 'warning');
                return;
            }
            api.showAlert('Contact feature coming soon!', 'info');
        }

        function shareItem(itemId, type) {
            const url = `${window.location.origin}/item-details.html?id=${itemId}&type=${type}`;
            if (navigator.share) {
                navigator.share({
                    title: 'Campus Lost & Found Item',
                    text: `Check out this ${type} item`,
                    url: url
                });
            } else {
                navigator.clipboard.writeText(url);
                api.showAlert('Link copied to clipboard!', 'success');
            }
        }

        function reportSimilar() {
            api.showAlert('Report similar item feature coming soon!', 'info');
        }

        function reportIssue() {
            api.showAlert('Report issue feature coming soon!', 'info');
        }

        function addToWatchlist() {
            api.showAlert('Watchlist feature coming soon!', 'info');
        }

        async function loadSimilarItems(category, currentType) {
            try {
                const [lostItems, foundItems] = await Promise.all([
                    api.get('/items/lost'),
                    api.get('/items/found')
                ]);

                const allItems = [
                    ...lostItems.map(item => ({...item, type: 'lost'})),
                    ...foundItems.map(item => ({...item, type: 'found'}))
                ].filter(item => item.category === category && item.type !== currentType)
                 .slice(0, 6);

                displaySimilarItems(allItems);
            } catch (error) {
                console.error('Error loading similar items:', error);
            }
        }

        function displaySimilarItems(items) {
            const container = document.getElementById('similarItems');
            
            if (items.length === 0) {
                container.innerHTML = '<p class="text-secondary text-center col-span-full">No similar items found</p>';
                return;
            }

            container.innerHTML = items.map(item => `
                <div class="card hover:shadow-lg transition-shadow cursor-pointer" onclick="viewItem('${item.id}', '${item.type}')">
                    <div class="card-body">
                        <div class="flex items-start justify-between mb-3">
                            <span class="badge ${item.type === 'lost' ? 'badge-warning' : 'badge-success'} text-xs">
                                ${item.type === 'lost' ? 'Lost' : 'Found'}
                            </span>
                            <span class="text-xs text-secondary">${formatDate(item.createdAt)}</span>
                        </div>
                        <h4 class="font-semibold mb-2">${escapeHtml(item.name)}</h4>
                        <p class="text-secondary text-sm mb-3">${escapeHtml(item.description || '').substring(0, 100)}...</p>
                        <div class="flex items-center justify-between">
                            <span class="text-xs text-secondary">${escapeHtml(item.location)}</span>
                            <svg class="w-4 h-4 text-primary" fill="currentColor" viewBox="0 0 20 20">
                                <path fill-rule="evenodd" d="M7.293 14.707a1 1 0 010-1.414L10.586 10 7.293 6.707a1 1 0 011.414-1.414l4 4a1 1 0 010 1.414l-4 4a1 1 0 01-1.414 0z" clip-rule="evenodd"/>
                            </svg>
                        </div>
                    </div>
                </div>
            `).join('');
        }

        function viewItem(itemId, type) {
            window.location.href = `item-details.html?id=${itemId}&type=${type}`;
        }

        function showError(message) {
            const container = document.getElementById('itemDetailsContainer');
            container.innerHTML = `
                <div class="text-center py-12">
                    <div class="w-16 h-16 bg-danger/10 text-danger rounded-full flex items-center justify-center mx-auto mb-4">
                        <svg class="w-8 h-8" fill="currentColor" viewBox="0 0 20 20">
                            <path fill-rule="evenodd" d="M18 10a8 8 0 11-16 0 8 8 0 0116 0zm-7 4a1 1 0 11-2 0 1 1 0 012 0zm-1-9a1 1 0 00-1 1v4a1 1 0 102 0V6a1 1 0 00-1-1z" clip-rule="evenodd"/>
                        </svg>
                    </div>
                    <h2 class="text-2xl font-bold mb-2">Error</h2>
                    <p class="text-secondary">${message}</p>
                    <a href="items.html" class="btn btn-primary mt-4">Browse Items</a>
                </div>
            `;
        }

        function escapeHtml(text) {
            if (!text) return '';
            const div = document.createElement('div');
            div.textContent = text;
            return div.innerHTML;
        }

        function formatDate(dateString) {
            if (!dateString) return 'Unknown';
            const date = new Date(dateString);
            return date.toLocaleDateString('en-US', {
                year: 'numeric',
                month: 'short',
                day: 'numeric',
                hour: '2-digit',
                minute: '2-digit'
            });
        }
    </script>
</body>
</html>
